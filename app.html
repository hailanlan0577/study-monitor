<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>专注监督 · Study Monitor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="back">← 主页</a>
    <h1>📚 专注监督</h1>
    <span id="connBadge" class="badge">初始化中</span>
  </header>

  <main>
    <!-- 摄像头画面 -->
    <section class="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="phaseTag" class="phase-tag">专注中</div>
      <div id="faceStatus" class="face-status">正在启动摄像头…</div>
      <div id="alertOverlay" class="alert-overlay hidden">
        <div class="alert-box">
          <div class="alert-icon">⚠️</div>
          <div id="alertText">开小差了！</div>
          <button id="alertBtn">我回来啦</button>
        </div>
      </div>
    </section>

    <!-- 模式切换 -->
    <section class="panel">
      <div class="mode-switch">
        <button id="modeFree" class="mode-btn active">自由模式</button>
        <button id="modePomodoro" class="mode-btn">番茄钟</button>
      </div>
    </section>

    <!-- 状态与计时 -->
    <section class="panel">
      <div class="state-row">
        <div id="stateDot" class="state-dot"></div>
        <span id="stateText">未开始</span>
        <span id="cycleText" class="cycle-text"></span>
      </div>
      <div id="timer" class="timer">00:00</div>
      <div class="stats-row">
        <div class="stat"><span id="focusPct">0%</span><label>专注率</label></div>
        <div class="stat"><span id="distCount">0</span><label>开小差</label></div>
        <div class="stat"><span id="distTime">0s</span><label>浪费</label></div>
      </div>
      <div class="btn-row">
        <button id="startBtn" class="btn primary">开始学习</button>
        <button id="stopBtn" class="btn" disabled>结束</button>
      </div>
    </section>

    <!-- 设置 -->
    <section class="panel" id="settingsPanel">
      <h2>⚙️ 设置</h2>
      <div class="setting">
        <label>灵敏度</label>
        <select id="sens">
          <option value="loose">宽松（少打扰）</option>
          <option value="normal" selected>标准</option>
          <option value="strict">严格（严盯）</option>
        </select>
      </div>
      <div class="setting">
        <label>提醒宽限 <span id="graceVal">3</span> 秒</label>
        <input type="range" id="grace" min="1" max="10" value="3" />
      </div>

      <h2 class="sub-h">⏰ 番茄钟</h2>
      <div class="setting row3">
        <label>专注 <span id="workVal">25</span> 分
          <input type="range" id="workMin" min="5" max="60" step="5" value="25" />
        </label>
        <label>休息 <span id="breakVal">5</span> 分
          <input type="range" id="breakMin" min="1" max="30" step="1" value="5" />
        </label>
        <label>每 <span id="cycleVal">4</span> 轮长休
          <input type="range" id="cyclesLong" min="2" max="8" value="4" />
        </label>
      </div>

      <div class="setting inline">
        <label><input type="checkbox" id="optSound" checked /> 声音提醒</label>
        <label><input type="checkbox" id="optVibrate" checked /> 震动提醒</label>
        <label><input type="checkbox" id="optVoice" checked /> 语音提醒</label>
      </div>
    </section>

    <!-- 每日统计 -->
    <section class="panel">
      <h2>📈 每日统计</h2>
      <div class="daily-today">
        <div class="stat"><span id="todayFocus">0分</span><label>今日专注</label></div>
        <div class="stat"><span id="todayDist">0次</span><label>今日开小差</label></div>
        <div class="stat"><span id="totalDays">0天</span><label>累计天数</label></div>
      </div>
      <div class="bars" id="bars"></div>
      <p class="bars-label">近 7 天专注时长（分钟）</p>
    </section>

    <!-- 记录 -->
    <section class="panel">
      <h2>📋 本次记录</h2>
      <ul id="logList" class="log-list"><li class="empty">暂无记录，开始学习吧</li></ul>
    </section>
  </main>

  <footer class="foot">摄像头画面仅在本机处理，不会上传 · 数据只存在你的浏览器里</footer>

  <script src="js/face-api.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
